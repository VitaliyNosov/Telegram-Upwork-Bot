name: Test Gemini Models
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini Model to test"
        required: false
        default: "gemini-3.1-flash-lite"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Gemini Model Test
        run: node scripts/test-gemini.js
        env:
          GEMINI_MODEL: ${{ inputs.model || 'gemini-3.1-flash-lite' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
