name: Poll Upwork Jobs
on:
  # schedule:
  #   # Каждые 5 минут — минимальный интервал, поддерживаемый GitHub Actions.
  #   # Реальные запуски могут быть с задержкой 5-15 минут в моменты нагрузки на GitHub.
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions для теста
jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write # нужно, чтобы commit & push data/*.json обратно в репозиторий работал
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run job poller
        run: node src/index.js
        env:
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPWORK_REFRESH_TOKEN: ${{ secrets.UPWORK_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Update refresh token secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f data/new_refresh_token.txt ]; then
            echo "Updating UPWORK_REFRESH_TOKEN secret..."
            gh secret set UPWORK_REFRESH_TOKEN < data/new_refresh_token.txt
            rm data/new_refresh_token.txt
          else
            echo "No new refresh token found."
          fi
      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          [ -f data/daily_stats.json ] && git add data/daily_stats.json
          git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push