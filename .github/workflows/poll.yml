name: Poll Upwork Jobs

on:
  schedule:
    # Каждые 5 минут — минимальный интервал, поддерживаемый GitHub Actions.
    # Реальные запуски могут быть с задержкой 5-15 минут в моменты нагрузки на GitHub.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # позволяет запустить вручную из вкладки Actions для теста

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write # нужно, чтобы commit & push data/*.json обратно в репозиторий работал

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run job poller
        run: node src/index.js

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json data/token.json
          git diff --staged --quiet || git commit -m "chore: update bot state [skip ci]"
          git push
